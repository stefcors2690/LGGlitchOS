<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">StefCors GL1tCh 0S</title><desc id="desc">Logo cyberpunk con glitch cromatico e frammentazione orizzontale periodica.</desc>
<defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff37db"/><stop offset=".53" stop-color="#b85cff"/><stop offset="1" stop-color="#00eaff"/></linearGradient><filter id="glow" x="-30%" y="-70%" width="160%" height="240%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="slice1"><rect x="0" y="120" width="1200" height="30"/></clipPath><clipPath id="slice2"><rect x="0" y="178" width="1200" height="24"/></clipPath><clipPath id="slice3"><rect x="0" y="232" width="1200" height="16"/></clipPath></defs>
<style>
.word{font-family:Arial,Helvetica,sans-serif;font-size:112px;font-weight:900;font-style:italic;letter-spacing:-3px}.brand{font-family:Arial,Helvetica,sans-serif;font-size:54px;font-weight:700;font-style:italic;letter-spacing:7px}.main{fill:url(#neon)}
#base{animation:shake 9s infinite steps(1,end)}#red,#blue{opacity:0;animation:ghost 9s infinite steps(1,end)}#red{fill:#ff1b9e;mix-blend-mode:screen}#blue{fill:#00eaff;mix-blend-mode:screen;animation-delay:-.035s}
.slice{opacity:0;animation:slice 9s infinite steps(1,end)}.s2{animation-delay:-.055s}.s3{animation-delay:-.1s}
.scan{opacity:0;animation:scan 9s infinite linear}
@keyframes shake{0%,13%,22%,57%,68%,100%{transform:translate(0,0)}14%{transform:translate(9px,-2px)}16%{transform:translate(-7px,2px)}19%{transform:translate(4px,0)}59%{transform:translate(-11px,1px)}62%{transform:translate(8px,-2px)}66%{transform:translate(-3px,0)}}
@keyframes ghost{0%,12.9%,22%,56.9%,68%,100%{opacity:0;transform:translate(0,0)}14%,59%{opacity:.85;transform:translate(-13px,0)}17%,63%{opacity:.65;transform:translate(12px,2px)}20%,66%{opacity:.35;transform:translate(-5px,0)}}
@keyframes slice{0%,12.9%,22%,56.9%,68%,100%{opacity:0;transform:translateX(0)}13.1%,59%{opacity:1;transform:translateX(30px)}16%,57.3%{opacity:1;transform:translateX(-23px)}20%,66%{opacity:.8;transform:translateX(12px)}}
@keyframes scan{0%,12%,23%,56%,69%,100%{opacity:0;transform:translateY(-95px)}14%,59%{opacity:.85;transform:translateY(95px)}21%,67%{opacity:0;transform:translateY(160px)}}
@media(prefers-reduced-motion:reduce){#base,#red,#blue,.slice,.scan{animation:none!important}#red,#blue,.slice,.scan{opacity:0!important}}
</style>
<g id="art" text-anchor="middle"><g id="base"><text class="brand main" x="600" y="112">StefCors</text><text class="word main" x="600" y="239" filter="url(#glow)">GL1tCh 0S</text></g><g id="red"><text class="brand" x="600" y="112">StefCors</text><text class="word" x="600" y="239">GL1tCh 0S</text></g><g id="blue"><text class="brand" x="600" y="112">StefCors</text><text class="word" x="600" y="239">GL1tCh 0S</text></g><g class="slice" clip-path="url(#slice1)"><text class="word" x="600" y="239" fill="#00eaff">GL1tCh 0S</text></g><g class="slice s2" clip-path="url(#slice2)"><text class="word" x="600" y="239" fill="#ff37db">GL1tCh 0S</text></g><g class="slice s3" clip-path="url(#slice3)"><text class="word" x="600" y="239" fill="#fff">GL1tCh 0S</text></g></g>
<rect class="scan" x="160" y="145" width="880" height="2" fill="#00eaff" filter="url(#glow)"/>
<path d="M220 285 H980" stroke="url(#neon)" stroke-width="2" opacity=".65"/><path d="M220 285 h75 M905 285 h75" stroke="#00eaff" stroke-width="5"/>
</svg>
